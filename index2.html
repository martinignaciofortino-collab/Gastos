<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Presupuesto">
<title>Mi Presupuesto</title>
<!-- using system fonts for reliability -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css" onerror="this.onerror=null;this.href='https://unpkg.com/@tabler/icons-webfont@2.47.0/dist/tabler-icons.min.css'">
<script src="https://unpkg.com/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--primary:#4F46E5;--primary-dark:#3730A3;--primary-light:#EEF2FF;--success:#10B981;--danger:#EF4444;--warning:#F59E0B;--bg:#F1F5F9;--card:#FFFFFF;--text:#1E293B;--text2:#64748B;--text3:#94A3B8;--border:#E2E8F0;--r:16px;--rs:10px;--sh:0 2px 12px rgba(79,70,229,.10);--sh-lg:0 8px 32px rgba(79,70,229,.15)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text)}
#root{height:100%;display:flex;flex-direction:column;max-width:430px;margin:0 auto;position:relative;background:var(--bg);overflow:hidden}
.page{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:80px;-webkit-overflow-scrolling:touch}
.page::-webkit-scrollbar{display:none}
.bottom-nav{position:absolute;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);display:flex;height:68px;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;cursor:pointer;padding:8px 0}
.nav-item i{font-size:22px;color:var(--text3);transition:color .2s}
.nav-item span{font-size:10px;color:var(--text3);font-weight:700;transition:color .2s}
.nav-item.active i,.nav-item.active span{color:var(--primary)}
.nav-center{flex:1;display:flex;align-items:center;justify-content:center}
.nav-fab{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#06B6D4);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(79,70,229,.4);margin-top:-20px}
.nav-fab i{font-size:26px;color:#fff}
.header{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);padding:50px 20px 28px;position:relative}
.header::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.header::after{content:'';position:absolute;bottom:-30px;left:20px;width:100px;height:100px;border-radius:50%;background:rgba(255,255,255,.05);pointer-events:none}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;position:relative;z-index:2}
.hdr-avatar{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;border:2px solid rgba(255,255,255,.4)}
.hdr-welcome{flex:1;padding:0 12px}
.hdr-welcome p{font-size:12px;color:rgba(255,255,255,.75)}
.hdr-welcome h2{font-size:16px;font-weight:800;color:#fff}
.hdr-gear{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;position:relative;z-index:2}
.hdr-gear i{font-size:20px;color:#fff}
.bal-card{background:rgba(255,255,255,.15);backdrop-filter:blur(10px);border-radius:var(--r);padding:18px 20px;border:1px solid rgba(255,255,255,.2);position:relative;z-index:1}
.bal-lbl{font-size:12px;color:rgba(255,255,255,.75);margin-bottom:4px}
.bal-amt{font-size:34px;font-weight:800;color:#fff;line-height:1}
.bal-month{font-size:12px;color:rgba(255,255,255,.6);margin-top:4px}
.bal-row{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
.bal-mini-lbl{font-size:10px;color:rgba(255,255,255,.65)}
.bal-mini-val{font-size:14px;font-weight:700;color:#fff}
.cards-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh);cursor:pointer;transition:transform .15s}
.card:active{transform:scale(.97)}
.card-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.card-icon i{font-size:20px;color:#fff}
.card-lbl{font-size:11px;color:var(--text2);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.card-val{font-size:20px;font-weight:800;color:var(--text);margin-top:2px}
.card-sub{font-size:11px;color:var(--text3);margin-top:2px}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:20px 16px 10px}
.sec-title{font-size:16px;font-weight:800;color:var(--text)}
.sec-action{font-size:12px;color:var(--primary);font-weight:700;background:none;border:none;cursor:pointer;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.cat-chip{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:60px;cursor:pointer;background:none;border:none;padding:0}
.cat-circle{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--primary-light);transition:all .2s}
.cat-circle i{font-size:22px;color:var(--primary)}
.cat-chip span{font-size:11px;color:var(--text2);font-weight:700;text-align:center}
.cat-chip.active .cat-circle{background:var(--primary)}
.cat-chip.active .cat-circle i,.cat-chip.active span{color:#fff}
.cat-chip.active span{color:var(--primary)}
.txn-list{padding:0 16px;display:flex;flex-direction:column;gap:8px}
.txn-item{background:var(--card);border-radius:var(--rs);padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh)}
.txn-icon{width:38px;height:38px;min-width:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.txn-icon i{font-size:18px;color:#fff}
.txn-info{flex:1;min-width:0}
.txn-name{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.txn-meta{font-size:11px;color:var(--text3);margin-top:2px;display:flex;gap:6px;align-items:center}
.bdg{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:700}
.bdg-cash{background:#DCFCE7;color:#15803D}
.bdg-card{background:#FEF3C7;color:#B45309}
.txn-right{display:flex;align-items:center;gap:4px;flex-shrink:0}
.txn-amt{font-size:14px;font-weight:800;color:var(--danger)}
.ibtn{background:none;border:none;cursor:pointer;padding:4px;line-height:1}
.cc-alert{margin:0 16px;background:linear-gradient(135deg,#FEF3C7,#FDE68A);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:12px;border:1px solid var(--warning)}
.sav-hero{background:linear-gradient(135deg,#10B981,#059669);margin:16px;border-radius:var(--r);padding:20px;box-shadow:0 4px 20px rgba(16,185,129,.3)}
.sav-hero h2{font-size:13px;color:rgba(255,255,255,.8);font-weight:700}
.sav-hero .amount{font-size:38px;font-weight:800;color:#fff}
.sav-hero .sub{font-size:12px;color:rgba(255,255,255,.7);margin-top:4px}
.prog-track{height:8px;background:rgba(255,255,255,.25);border-radius:4px;margin-top:14px;overflow:hidden}
.prog-fill{height:100%;background:#fff;border-radius:4px;transition:width .6s}
.sav-item{background:var(--card);border-radius:var(--rs);padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh)}
.sav-icon{width:36px;height:36px;border-radius:10px;background:#D1FAE5;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sav-icon i{font-size:18px;color:#059669}
.debt-card{margin:0 16px 10px;background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh)}
.debt-track{height:6px;background:#FEE2E2;border-radius:3px;overflow:hidden;margin:8px 0}
.debt-fill{height:100%;background:var(--success);border-radius:3px}
.inst-row{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;margin-top:4px}
.inst-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.inst-dot i{font-size:13px;color:#fff}
.cc-visual{margin:16px;border-radius:var(--r);padding:22px;background:linear-gradient(135deg,#1E293B,#334155);color:#fff;position:relative;overflow:hidden;box-shadow:var(--sh-lg)}
.cc-visual::before{content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.06);pointer-events:none}
.cc-month-card{background:var(--card);border-radius:var(--rs);padding:14px;box-shadow:var(--sh)}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-end}
.overlay.open{display:flex}
.sheet{background:var(--bg);border-radius:24px 24px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom)}
.sheet::-webkit-scrollbar{display:none}
.sh-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:12px auto 4px}
.sh-title{font-size:18px;font-weight:800;color:var(--text);padding:8px 20px 16px;border-bottom:1px solid var(--border)}
.sh-body{padding:20px;display:flex;flex-direction:column;gap:14px}
.fg{display:flex;flex-direction:column;gap:6px}
.flbl{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.05em}
.finp{background:var(--card);border:1.5px solid var(--border);border-radius:var(--rs);padding:12px 14px;font-size:16px;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;width:100%;outline:none;transition:border-color .2s}
.finp:focus{border-color:var(--primary)}
.tab-row{display:flex;background:var(--card);border-radius:var(--rs);padding:4px;gap:4px;border:1.5px solid var(--border)}
.tab-btn{flex:1;padding:9px 6px;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;background:none;color:var(--text2);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;transition:all .2s}
.tab-btn.active{background:var(--primary);color:#fff}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat-item{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:var(--rs);border:1.5px solid var(--border);cursor:pointer;background:var(--card);transition:all .15s}
.cat-item i{font-size:20px;color:var(--text3)}
.cat-item span{font-size:10px;color:var(--text2);font-weight:700;text-align:center}
.cat-item.active{border-color:var(--primary);background:var(--primary-light)}
.cat-item.active i{color:var(--primary)}
.cat-item.active span{color:var(--primary)}
.btn-main{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border:none;border-radius:var(--rs);padding:16px;font-size:16px;font-weight:800;cursor:pointer;width:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;box-shadow:0 4px 16px rgba(79,70,229,.3)}
.btn-main:active{opacity:.9}
.btn-danger-full{background:#FEE2E2;color:var(--danger);border:none;border-radius:var(--rs);padding:14px;font-size:15px;font-weight:700;cursor:pointer;width:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.auth-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;background:linear-gradient(160deg,var(--primary-dark) 0%,var(--primary) 50%,var(--bg) 100%)}
.auth-logo{width:80px;height:80px;border-radius:24px;background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.auth-logo i{font-size:40px;color:#fff}
.auth-card{background:var(--card);border-radius:var(--r);padding:24px;width:100%;box-shadow:var(--sh-lg)}
.auth-tabs{display:flex;background:var(--bg);border-radius:var(--rs);padding:4px;margin-bottom:20px}
.auth-tab{flex:1;padding:9px;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;background:none;color:var(--text2);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;transition:all .2s}
.auth-tab.active{background:var(--primary);color:#fff}
.err-box{background:#FEE2E2;color:#B91C1C;border-radius:var(--rs);padding:10px 12px;font-size:13px;font-weight:700;display:none}
.err-box.show{display:block}
.ok-box{background:#D1FAE5;color:#065F46;border-radius:var(--rs);padding:10px 12px;font-size:13px;font-weight:700;display:none}
.ok-box.show{display:block}
.setup-wrap{flex:1;display:flex;flex-direction:column;padding:50px 24px 32px;background:var(--bg)}
.cfg-row{background:var(--card);margin:0 16px 8px;border-radius:var(--rs);padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh);cursor:pointer}
.cfg-row-info{flex:1}
.cfg-row-info h3{font-size:14px;font-weight:700;color:var(--text)}
.cfg-row-info p{font-size:12px;color:var(--text3)}
.loading-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.spinner{width:44px;height:44px;border:4px solid var(--primary-light);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:40px 20px;color:var(--text3)}
.empty i{font-size:48px;opacity:.35;display:block;margin-bottom:12px}
.empty p{font-size:14px}
.info-box{background:var(--primary-light);border-radius:var(--rs);padding:10px 14px;font-size:12px;color:#4338CA;line-height:1.5}
</style>
</head>
<body>
<div id="root">
  <div class="loading-wrap"><div class="spinner"></div><p style="font-size:15px;color:var(--text2);font-weight:700">Cargando...</p></div>
</div>
<script>
const SUPABASE_URL='https://ytplmqepzayqimylfxsb.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_V691cVZyp4n1sFZ7PPgByw_gULPIWmR';
const DEMO_MODE=SUPABASE_URL.includes('TU_PROYECTO');
const createClient=(supabase.createClient||supabase.default&&supabase.default.createClient);
let sb=null,currentUser=null,userProfile=null;
let state={expenses:[],savings:[],debts:[],fixedExpenses:[],ccExpenses:[],activeTab:'home',filterCat:'all',addType:'cash',selectedCat:null,debtType:'installment',editingId:null,editingType:null};

const CATS=[
  {id:'food',label:'Comida',icon:'ti-tools-kitchen-2',color:'#10B981'},
  {id:'transport',label:'Transporte',icon:'ti-car',color:'#3B82F6'},
  {id:'housing',label:'Vivienda',icon:'ti-home',color:'#8B5CF6'},
  {id:'health',label:'Salud',icon:'ti-heart-rate-monitor',color:'#EC4899'},
  {id:'entertainment',label:'Ocio',icon:'ti-device-gamepad-2',color:'#F59E0B'},
  {id:'shopping',label:'Compras',icon:'ti-shopping-bag',color:'#EF4444'},
  {id:'education',label:'Educacion',icon:'ti-school',color:'#06B6D4'},
  {id:'other',label:'Otro',icon:'ti-dots-circle-horizontal',color:'#94A3B8'},
];
const getCat=id=>CATS.find(c=>c.id===id)||CATS[7];
const fmt=n=>'$'+Math.round(n||0).toLocaleString('es-AR');
const fmtD=s=>{if(!s)return'';const d=new Date(s+'T00:00:00');return d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit'});};
const fmtM=s=>{if(!s)return'';const d=new Date(s+'-01T00:00:00');return d.toLocaleDateString('es-AR',{month:'long',year:'numeric'});};
const tod=()=>new Date().toISOString().split('T')[0];
const ym=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;};
const R=id=>document.getElementById(id);
const gel=id=>document.getElementById(id);

async function init(){
  try {
    if(DEMO_MODE){loadDemo();return;}
    sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    const {data:{session}}=await sb.auth.getSession();
    if(session){currentUser=session.user;await loadData();renderApp();}
    else renderAuth();
  } catch(e) {
    var r=document.getElementById('root');
    if(r) r.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:24px;text-align:center;font-family:sans-serif">'
      +'<div style="font-size:32px;margin-bottom:12px">!</div>'
      +'<h2 style="color:#EF4444;margin-bottom:8px;font-size:18px">Error al cargar</h2>'
      +'<p style="color:#64748B;font-size:13px;margin-bottom:20px;word-break:break-all">'+String(e)+'</p>'
      +'<button onclick="location.reload()" style="background:#4F46E5;color:#fff;border:none;border-radius:10px;padding:12px 24px;font-size:15px;font-weight:700;cursor:pointer">Reintentar</button>'
      +'</div>';
  }
}

async function loadData(){
  const uid=currentUser.id;
  const[p,e,s,d,f]=await Promise.all([
    sb.from('profiles').select('*').eq('id',uid).single(),
    sb.from('expenses').select('*').eq('user_id',uid).order('created_at',{ascending:false}),
    sb.from('savings').select('*').eq('user_id',uid).order('created_at',{ascending:false}),
    sb.from('debts').select('*').eq('user_id',uid).order('created_at',{ascending:false}),
    sb.from('fixed_expenses').select('*').eq('user_id',uid).order('name',{ascending:true}),
  ]);
  userProfile=p.data;
  state.expenses=e.data||[];
  state.savings=s.data||[];
  state.debts=d.data||[];
  state.fixedExpenses=f.data||[];
  state.ccExpenses=state.expenses.filter(x=>x.type==='card');
  // If profile exists but no name, try auth metadata
  if(userProfile && !userProfile.name) {
    const meta = currentUser.user_metadata;
    if(meta && meta.name) userProfile.name = meta.name;
  }
  if(!userProfile) renderSetup();
  else if(!userProfile.income || userProfile.income===0) renderSetup();
}

function loadDemo(){
  currentUser={id:'demo',email:'demo@demo.com'};
  userProfile={id:'demo',name:'Demo',income:150000};
  const nmd=()=>{const d=new Date();d.setMonth(d.getMonth()+1);d.setDate(10);return d.toISOString().split('T')[0];};
  state.expenses=[{id:1,name:'Supermercado',amount:12500,category:'food',type:'cash',date:tod()},{id:2,name:'Netflix',amount:4500,category:'entertainment',type:'card',cc_due_date:nmd(),date:tod()}];
  state.savings=[{id:1,description:'Ahorro inicial',amount:50000,date:tod()}];
  state.debts=[];
  state.ccExpenses=state.expenses.filter(x=>x.type==='card');
  renderApp();
}

// AUTH
function renderAuth(){
  R('root').innerHTML=`
  <div class="auth-wrap">
    <div class="auth-logo"><i class="ti ti-wallet"></i></div>
    <div style="font-size:28px;font-weight:800;color:#fff;margin-bottom:6px">Mi Presupuesto</div>
    <div style="font-size:14px;color:rgba(255,255,255,.7);margin-bottom:36px;text-align:center">Controla tus gastos y ahorra mas</div>
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="at-l" onclick="swAuthTab('login')">Iniciar sesion</button>
        <button class="auth-tab" id="at-r" onclick="swAuthTab('register')">Registrarme</button>
      </div>
      <div id="auth-err" class="err-box"></div>
      <div id="auth-form"></div>
    </div>
  </div>`;
  buildAuthForm('login');
}

function swAuthTab(tab){
  R('at-l').classList.toggle('active',tab==='login');
  R('at-r').classList.toggle('active',tab==='register');
  R('auth-err').classList.remove('show');
  buildAuthForm(tab);
}

function buildAuthForm(tab){
  R('auth-form').innerHTML=tab==='login'?`
    <div class="fg" style="margin-bottom:12px"><label class="flbl">Email</label><input class="finp" type="email" id="ae" placeholder="tu@email.com" inputmode="email"></div>
    <div class="fg" style="margin-bottom:20px"><label class="flbl">Contrasena</label><input class="finp" type="password" id="ap" placeholder="********"></div>
    <button class="btn-main" onclick="doLogin()">Ingresar &#8594;</button>`:`
    <div class="fg" style="margin-bottom:12px"><label class="flbl">Tu nombre</label><input class="finp" type="text" id="an" placeholder="Ej: Martin Garcia"></div>
    <div class="fg" style="margin-bottom:12px"><label class="flbl">Email</label><input class="finp" type="email" id="ae" placeholder="tu@email.com" inputmode="email"></div>
    <div class="fg" style="margin-bottom:20px"><label class="flbl">Contrasena</label><input class="finp" type="password" id="ap" placeholder="minimo 6 caracteres"></div>
    <button class="btn-main" onclick="doRegister()">Crear cuenta &#8594;</button>`;
}

async function doLogin(){
  const email=R('ae').value.trim(),pass=R('ap').value;
  const{data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){showAE(error.message);return;}
  currentUser=data.user;
  await loadData();
  if(!userProfile)renderSetup();else renderApp();

async function doRegister(){
  const name=R('an').value.trim(),email=R('ae').value.trim(),pass=R('ap').value;
  if(!name||!email||pass.length<6){showAE('Completa todos los campos (contrasena minimo 6 caracteres)');return;}
  const{data,error}=await sb.auth.signUp({email,password:pass});
  if(error){showAE(error.message);return;}
  currentUser=data.user;
  await sb.from('profiles').upsert({id:currentUser.id,name,income:0});
  userProfile={id:currentUser.id,name,income:0};
  state.expenses=[];state.savings=[];state.debts=[];state.ccExpenses=[];
  renderSetup();
}

// COMPUTED
function ccDueThisM(){return state.ccExpenses.filter(e=>e.cc_due_date&&e.cc_due_date.startsWith(ym())).reduce((a,e)=>a+e.amount,0);}
function debtDueThisM(){
  const cur=ym();
  return state.debts.reduce((a,d)=>{
    if(!d.installments||!d.installment_amount||!d.start_month)return a;
    // Count ALL installments of this month: paid (already spent) + unpaid (will be spent)
    return a+getInst(d).filter(i=>i.month===cur).reduce((s,i)=>s+i.amount,0);
  },0);
}
function getInst(d){
  if(!d.installments||!d.installment_amount||!d.start_month)return[];
  const[sy,sm]=d.start_month.split('-').map(Number);
  return Array.from({length:d.installments},(_,i)=>{
    const dt=new Date(sy,sm-1+i,d.due_day||6);
    const m=`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}`;
    return{num:i+1,month:m,due_date:dt.toISOString().split('T')[0],amount:d.installment_amount,paid:i<(d.paid_installments||0)};
  });
}

// GASTOS
function bGastos(){
  const totAll=state.expenses.reduce((a,e)=>a+e.amount,0);
  const totCash=state.expenses.filter(e=>e.type==='cash').reduce((a,e)=>a+e.amount,0);

      <div style="font-size:12px;color:rgba(255,255,255,.75);font-weight:700">Total gastado</div>
      <div style="font-size:30px;font-weight:800;color:#fff">${fmt(totAll)}</div>
      <div style="display:flex;gap:20px;margin-top:10px">
        <div><div style="font-size:11px;color:rgba(255,255,255,.65)">Efec/Transf</div><div style="font-size:16px;font-weight:800;color:#fff">${fmt(totCash)}</div></div>
        <div><div style="font-size:11px;color:rgba(255,255,255,.65)">Tarjeta</div><div style="font-size:16px;font-weight:800;color:#FDE68A">${fmt(totCard)}</div></div>
      </div>
    </div>
  </div>
  <div class="sec-hdr"><div class="sec-title">Por categoria</div></div>
  ${!cd.length?`<div class="empty"><i class="ti ti-receipt"></i><p>Sin gastos registrados</p></div>`:`
  <div style="padding:0 16px;display:flex;flex-direction:column;gap:10px">
    ${cd.map(c=>{
      const bw=Math.round(c.total/maxT*100),cp=c.total>0?Math.round(c.cash/c.total*100):0;
      return`<div style="background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh)">
        <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
          <div style="width:40px;height:40px;border-radius:12px;background:${c.color};display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="ti ${c.icon}" style="font-size:20px;color:#fff"></i></div>
          <div style="flex:1"><div style="font-size:15px;font-weight:800">${c.label}</div><div style="font-size:12px;color:var(--text3)">${state.expenses.filter(e=>e.category===c.id).length} gasto${state.expenses.filter(e=>e.category===c.id).length!==1?'s':''}</div></div>
          <div style="font-size:18px;font-weight:800">${fmt(c.total)}</div>
        </div>
        <div style="height:8px;border-radius:4px;overflow:hidden;background:var(--bg);margin-bottom:8px;width:${bw}%"><div style="height:100%;display:flex">${c.cash>0?`<div style="width:${cp}%;background:var(--success);border-radius:4px 0 0 4px"></div>`:''}${c.card>0?`<div style="width:${100-cp}%;background:var(--warning);border-radius:${c.cash>0?'0 4px 4px 0':'4px'}"></div>`:''}</div></div>
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          ${c.cash>0?`<div style="display:flex;align-items:center;gap:5px"><div style="width:8px;height:8px;border-radius:2px;background:var(--success)"></div><span style="font-size:12px;color:var(--text2)">Efec/Transf: <strong>${fmt(c.cash)}</strong></span></div>`:''}
          ${c.card>0?`<div style="display:flex;align-items:center;gap:5px"><div style="width:8px;height:8px;border-radius:2px;background:var(--warning)"></div><span style="font-size:12px;color:var(--text2)">Tarjeta: <strong>${fmt(c.card)}</strong></span></div>`:''}
        </div>
      </div>`;
    }).join('')}
  </div>
  <div class="sec-hdr"><div class="sec-title">Distribucion</div></div>
  <div style="margin:0 16px 16px;background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--sh)">
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">${cd.map(c=>`<span style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text2)"><span style="width:8px;height:8px;border-radius:2px;background:${c.color};display:inline-block"></span>${c.label}</span>`).join('')}</div>
    <div style="position:relative;width:100%;height:200px"><canvas id="gChart" role="img" aria-label="Distribucion de gastos"></canvas></div>
  </div>`}`;
}
function initChart(){
  const cv=R('gChart');if(!cv)return;
  const d=CATS.map(c=>({...c,total:state.expenses.filter(e=>e.category===c.id).reduce((a,e)=>a+e.amount,0)})).filter(c=>c.total>0);
  if(!d.length)return;
  new Chart(cv,{type:'doughnut',data:{labels:d.map(c=>c.label),datasets:[{data:d.map(c=>c.total),backgroundColor:d.map(c=>c.color),borderWidth:0,hoverOffset:6}]},options:{responsive:true,maintainAspectRatio:false,cutout:'60%',plugins:{legend:{display:false}}}});
}

// DEBTS
function bDebts(){
  var cur=ym();
  var totP=state.debts.reduce(function(a,d){return a+(d.total-(d.paid||0));},0);
  var dueM=debtDueThisM();
  var _t='debt';
  var html='<div style="padding-top:50px"><div class="sec-hdr"><div class="sec-title">Deudas</div><button class="sec-action" onclick="openAdd(_t)">+ Nueva</button></div></div>';
  html+='<div style="margin:0 16px 16px;background:linear-gradient(135deg,#FEE2E2,#FECACA);border-radius:var(--r);padding:20px;border:1px solid #FCA5A5">';
  html+='<div style="font-size:13px;color:#7F1D1D;font-weight:700">Total pendiente</div>';
  html+='<div style="font-size:34px;font-weight:800;color:#B91C1C">'+fmt(totP)+'</div>';
  html+='<div style="display:flex;justify-content:space-between;margin-top:8px">';
  html+='<span style="font-size:12px;color:#991B1B">'+state.debts.length+' deuda'+(state.debts.length!==1?'s':'')+'</span>';
  if(dueM>0) html+='<div style="background:rgba(185,28,28,.15);border-radius:8px;padding:4px 10px;text-align:right"><div style="font-size:10px;color:#7F1D1D;font-weight:700">Vence este mes</div><div style="font-size:14px;font-weight:800;color:#B91C1C">'+fmt(dueM)+'</div></div>';
  html+='</div></div>';
  if(!state.debts.length){
    html+='<div class="empty"><i class="ti ti-mood-happy"></i><p>Sin deudas registradas!</p></div>';
    return html;
  }
  state.debts.forEach(function(d){
    var inst=getInst(d);
    var pc=d.paid_installments||0;
    var rem=d.total-(d.paid||0);
    var pct=d.total>0?Math.round((d.paid||0)/d.total*100):0;
    var colId='dc-'+d.id;
    html+='<div class="debt-card">';
    // Header row
    html+='<div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:12px">';
    html+='<div style="width:42px;height:42px;border-radius:12px;background:#FEE2E2;display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="ti ti-alert-circle" style="font-size:20px;color:var(--danger)"></i></div>';
    html+='<div style="flex:1"><div style="font-size:15px;font-weight:800">'+d.name+'</div>';
    html+='<div style="font-size:12px;color:var(--text3)">';
    if(inst.length) html+=pc+'/'+d.installments+' cuotas - '+fmt(d.installment_amount)+'/mes';
    else html+=(d.notes||'')+(d.due_date?' - Vence '+fmtD(d.due_date):'');
    html+='</div></div>';
    html+='<div style="text-align:right">';
    html+='<div style="font-size:14px;font-weight:800;color:var(--danger)">'+fmt(rem)+'</div>';
    html+='<div style="font-size:11px;color:var(--text3)">pendiente</div>';
    html+='<div style="display:flex;gap:8px;margin-top:4px;justify-content:flex-end">';
    html+='<button onclick="editDebt('+d.id+')" style="background:none;border:none;cursor:pointer;color:var(--primary);font-size:11px;font-weight:700;font-family:Nunito,sans-serif;display:flex;align-items:center;gap:2px;padding:0"><i class="ti ti-pencil" style="font-size:13px"></i> Editar</button>';
    html+='<button onclick="delDebt('+d.id+')" style="background:none;border:none;cursor:pointer;color:var(--danger);font-size:11px;font-weight:700;font-family:Nunito,sans-serif;display:flex;align-items:center;gap:2px;padding:0"><i class="ti ti-trash" style="font-size:13px"></i> Borrar</button>';
    html+='</div></div></div>';
    // Progress bar
    html+='<div class="debt-track"><div class="debt-fill" style="width:'+pct+'%"></div></div>';
    html+='<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:6px"><span>'+pct+'% pagado</span><span>Total: '+fmt(d.total)+'</span></div>';
    // Lump sum: paid button
    if(!inst.length){
      var btnLabel=d.paid>=d.total?'Pagada - Marcar como pendiente':'Marcar como pagada';
      var btnColor=d.paid>=d.total?'var(--text3)':'var(--success)';
      var btnBg=d.paid>=d.total?'#F8FAFC':'#F0FDF4';
      var btnBorder=d.paid>=d.total?'var(--border)':'#10B981';
      html+='<button onclick="markLumpPaid('+d.id+')" style="width:100%;background:'+btnBg+';border:1.5px solid '+btnBorder+';border-radius:8px;padding:9px;font-size:13px;font-weight:700;color:'+btnColor+';cursor:pointer;font-family:Nunito,sans-serif;margin-bottom:4px">'+btnLabel+'</button>';
    }
    // Installments: collapsible
    if(inst.length){
      html+='<button onclick="toggleDebtDetail(&quot;'+colId+'&quot;)" style="width:100%;background:var(--bg);border:none;border-radius:8px;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-family:Nunito,sans-serif;margin-bottom:4px">';
      html+='<span style="font-size:12px;font-weight:700;color:var(--text2)">Ver cuotas ('+pc+' pagadas de '+d.installments+')</span>';
      html+='<i id="arr-'+colId+'" class="ti ti-chevron-down" style="font-size:16px;color:var(--text3)"></i></button>';
      html+='<div id="'+colId+'" style="display:none;flex-direction:column;gap:4px">';
      inst.forEach(function(i){
        var isPast=i.month<cur&&!i.paid, isNow=i.month===cur&&!i.paid;
        var bg=i.paid?'#F0FDF4':isPast?'#FEF2F2':isNow?'#FFFBEB':'var(--bg)';
        var db=i.paid?'#10B981':isPast?'#EF4444':isNow?'#F59E0B':'#CBD5E1';
        var ic=i.paid?'ti-check':isPast?'ti-alert-triangle':isNow?'ti-clock':'ti-circle';
        html+='<div class="inst-row" style="background:'+bg+'">';
        html+='<div class="inst-dot" style="background:'+db+'"><i class="ti '+ic+'"></i></div>';
        html+='<div style="flex:1"><div style="font-size:13px;font-weight:700">Cuota '+i.num+'/'+d.installments+'</div>';
        html+='<div style="font-size:11px;color:var(--text3)">Vence '+fmtD(i.due_date)+(isNow?' - Este mes':'')+(isPast?' - Vencida':'')+'</div></div>';
        html+='<div style="text-align:right"><div style="font-size:13px;font-weight:800">'+fmt(i.amount)+'</div>';
        var btnLbl=i.paid?'Desmarcar':'Marcar pagada';
        var btnClr=i.paid?'var(--text3)':'var(--success)';
        html+='<button onclick="markPaid('+d.id+','+i.num+')" style="font-size:11px;color:'+btnClr+';background:none;border:none;cursor:pointer;font-weight:700;font-family:Nunito,sans-serif">'+btnLbl+'</button>';
        html+='</div></div>';
      });
      html+='</div>';
    }
    html+='</div>';
  });
  return html;
}

// ADD SHEET
let aiT=null;
function openAdd(pre){
  state.editingId=null;state.editingType=null;
  resetAdd();
  R('ov-add').classList.add('open');
  R('add-title').textContent='Registrar movimiento';
  R('add-btn').textContent='Guardar';
  const t=pre||'cash';
  state.addType=t;
  applyT(t);
  setDDs();
}
function closeAdd(){R('ov-add').classList.remove('open');state.editingId=null;state.editingType=null;}
function resetAdd(){
  ['add-name','add-amt','debt-name','inst-amt','inst-n','inst-day','lump-amt','lump-notes','fixed-name','fixed-amt'].forEach(id=>{const el=R(id);if(el)el.value='';});
  const fac=R('fixed-ai-chip');if(fac)fac.style.display='none';
  state.selectedCat=null;
  ['ai-chip','cat-override','d-prev'].forEach(id=>{const el=R(id);if(el)el.style.display='none';});
  buildCatGrid();
}
function applyT(t){
  ['cash','card','debt','fixed'].forEach(x=>R('type-'+x)?.classList.toggle('active',x===t));
  const ef=R('exp-fields'),df=R('debt-fields'),ff=R('fixed-fields'),cw=R('cc-due-wrap');
  if(ef)ef.style.display=(t==='debt'||t==='fixed')?'none':'block';
  if(df)df.style.display=t==='debt'?'block':'none';
  if(ff)ff.style.display=t==='fixed'?'block':'none';
  if(cw)cw.style.display=t==='card'?'block':'none';
  const ac=R('ai-chip');if(ac&&(t==='debt'||t==='fixed'))ac.style.display='none';
  if(t==='debt'){state.debtType='installment';applyDT('installment');const sm=R('inst-start');if(sm)sm.value=ym();}
  if(t==='fixed'){fxPay='cash';setFxPay('cash');}
}
function setType(t){state.addType=t;applyT(t);state.selectedCat=null;}
function applyDT(t){
  R('dt-inst')?.classList.toggle('active',t==='installment');
  R('dt-lump')?.classList.toggle('active',t==='lump');
  const iF=R('dt-inst-f'),lF=R('dt-lump-f');
  if(iF)iF.style.display=t==='installment'?'block':'none';
  if(lF)lF.style.display=t==='lump'?'block':'none';
}
function setDT(t){state.debtType=t;applyDT(t);}
function updDPreview(){
  const a=parseFloat(R('inst-amt')?.value)||0,n=parseInt(R('inst-n')?.value)||0;
  const p=R('d-prev'),pt=R('d-prev-txt');
  if(a>0&&n>0&&p&&pt){p.style.display='block';pt.textContent=`Total: ${fmt(a*n)}  -  ${n} cuotas de ${fmt(a)}`;}
  else if(p)p.style.display='none';

  const cd=R('add-cc-due');if(cd&&!cd.value){const d=new Date();d.setMonth(d.getMonth()+1);d.setDate(10);cd.value=d.toISOString().split('T')[0];}

async function submitAdd(){
  const type=state.addType;

  if(type==='fixed'){
    const name=R('fixed-name')?.value.trim();
    const amt=parseFloat(R('fixed-amt')?.value)||0;
    if(!name||amt<=0){alert('Completa nombre y monto');return;}
    const entry={name,amount:amt,category:fxCat||'other',pay_type:fxPay||'cash',active:true};
    if(DEMO_MODE){entry.id=Date.now();state.fixedExpenses.push(entry);}
    else{const{data}=await sb.from('fixed_expenses').insert({...entry,user_id:currentUser.id}).select().single();if(data)state.fixedExpenses.push(data);}
    closeAdd();go('fixed');return;
  }

  if(type==='debt'){
    const name=R('debt-name')?.value.trim();
    if(!name){alert('Ingresa el nombre de la deuda');return;}
    let debt;
    if(state.debtType==='installment'){
      const a=parseFloat(R('inst-amt')?.value)||0,n=parseInt(R('inst-n')?.value)||0,day=parseInt(R('inst-day')?.value)||6,start=R('inst-start')?.value||ym();
      if(a<=0||n<=0){alert('Completa monto por cuota y cantidad de cuotas');return;}
      debt={name,total:a*n,paid:0,paid_installments:0,installment_amount:a,installments:n,due_day:day,start_month:start,notes:`${n} cuotas de ${fmt(a)}`};
    }else{
      const a=parseFloat(R('lump-amt')?.value)||0,due=R('lump-due')?.value||'',notes=R('lump-notes')?.value||'';
      if(a<=0){alert('Ingresa un monto');return;}
      debt={name,total:a,paid:0,paid_installments:0,due_date:due,notes};
    }
    if(state.editingId&&state.editingType==='debt'){
      if(!DEMO_MODE)await sb.from('debts').update(debt).eq('id',state.editingId);
      const idx=state.debts.findIndex(x=>x.id===state.editingId);
      if(idx!==-1)state.debts[idx]={...state.debts[idx],...debt};
      state.editingId=null;state.editingType=null;
    }else{
      if(DEMO_MODE){debt.id=Date.now();state.debts.push(debt);}
      else{const{data}=await sb.from('debts').insert({...debt,user_id:currentUser.id}).select().single();if(data)state.debts.push(data);}
    }
    closeAdd();go('debts');return;
  }
  const name=R('add-name')?.value.trim(),amount=parseFloat(R('add-amt')?.value)||0;
  if(!name||amount<=0){alert('Completa nombre y monto');return;}
  const category=state.selectedCat||'other';
  const cc_due_date=type==='card'?R('add-cc-due')?.value||null:null;
  if(state.editingId&&state.editingType==='expense'){
    const upd={name,amount,category,type,cc_due_date};
    if(!DEMO_MODE)await sb.from('expenses').update(upd).eq('id',state.editingId);
    const idx=state.expenses.findIndex(e=>e.id===state.editingId);
    if(idx!==-1)state.expenses[idx]={...state.expenses[idx],...upd};
    state.ccExpenses=state.expenses.filter(e=>e.type==='card');
    state.editingId=null;state.editingType=null;
  }else{
    const exp={name,amount,category,type,cc_due_date,date:tod()};
    if(DEMO_MODE){exp.id=Date.now();state.expenses.unshift(exp);if(type==='card')state.ccExpenses.unshift(exp);}
    else{const{data}=await sb.from('expenses').insert({...exp,user_id:currentUser.id}).select().single();if(data){state.expenses.unshift(data);if(type==='card')state.ccExpenses.unshift(data);}}
  }
  closeAdd();go(state.activeTab);
}
function editExp(id){
  const e=state.expenses.find(x=>x.id===id);if(!e)return;
  state.editingId=id;state.editingType='expense';
  openAdd(e.type);
  setTimeout(()=>{
    const n=R('add-name');if(n)n.value=e.name;
    const a=R('add-amt');if(a)a.value=e.amount;
    if(e.cc_due_date){const cd=R('add-cc-due');if(cd)cd.value=e.cc_due_date;}
    if(e.category)selCat(e.category);
    R('add-title').textContent='Editar gasto';
    R('add-btn').textContent='Guardar cambios';
  },80);
}
async function delExp(id){
  if(!confirm('Confirmar: borrar este gasto?'))return;
  if(!DEMO_MODE)await sb.from('expenses').delete().eq('id',id);
  state.expenses=state.expenses.filter(e=>e.id!==id);
  state.ccExpenses=state.ccExpenses.filter(e=>e.id!==id);
  go(state.activeTab);
}

function closeSav(){R('ov-sav').classList.remove('open');state.editingId=null;state.editingType=null;}
function editSav(id){openSav(id);}
async function submitSav(){
  const desc=R('sav-desc')?.value.trim(),amt=parseFloat(R('sav-amt')?.value)||0;
  if(!desc||amt<=0){alert('Completa descripcion y monto');return;}
  if(state.editingId&&state.editingType==='saving'){
    if(!DEMO_MODE)await sb.from('savings').update({description:desc,amount:amt}).eq('id',state.editingId);
    const idx=state.savings.findIndex(s=>s.id===state.editingId);
    if(idx!==-1)state.savings[idx]={...state.savings[idx],description:desc,amount:amt};
    state.editingId=null;state.editingType=null;
  }else{
    const entry={description:desc,amount:amt,date:tod()};
    if(DEMO_MODE){entry.id=Date.now();state.savings.unshift(entry);}
    else{const{data}=await sb.from('savings').insert({...entry,user_id:currentUser.id}).select().single();if(data)state.savings.unshift(data);}
  }
  closeSav();go('savings');
}
async function delSav(id){
  if(!confirm('Confirmar: borrar este ahorro?'))return;
  if(!DEMO_MODE)await sb.from('savings').delete().eq('id',id);
  state.savings=state.savings.filter(s=>s.id!==id);go('savings');
}
function editDebt(id){
  const d=state.debts.find(x=>x.id===id);
  if(!d)return;
  state.editingId=id;
  state.editingType='debt';
  openAdd('debt');
  setTimeout(function(){
    var n=R('debt-name');if(n)n.value=d.name;
    if(d.installments&&d.installment_amount){
      setDT('installment');
      var ia=R('inst-amt');if(ia)ia.value=d.installment_amount;
      var inn=R('inst-n');if(inn)inn.value=d.installments;
      var iday=R('inst-day');if(iday)iday.value=d.due_day||6;
      var is=R('inst-start');if(is)is.value=d.start_month||ym();
      updDPreview();
    }else{
      setDT('lump');
      var la=R('lump-amt');if(la)la.value=d.total;
      var ld=R('lump-due');if(ld)ld.value=d.due_date||'';
      var ln=R('lump-notes');if(ln)ln.value=d.notes||'';
    }
    var t=R('add-title');if(t)t.textContent='Editar deuda';
    var b=R('add-btn');if(b)b.textContent='Guardar cambios';
  },100);
}

async function markLumpPaid(id){
  const d=state.debts.find(x=>x.id===id);
  if(!d)return;
  const newPaid=d.paid>=d.total?0:d.total;
  if(!DEMO_MODE)await sb.from('debts').update({paid:newPaid}).eq('id',id);
  d.paid=newPaid;
  go('debts');
}

async function delDebt(id){
  if(!confirm('Confirmar: borrar esta deuda?'))return;
  if(!DEMO_MODE)await sb.from('debts').delete().eq('id',id);
  state.debts=state.debts.filter(d=>d.id!==id);go('debts');
}
function toggleDebtDetail(id){
  const el=document.getElementById(id);
  const arr=document.getElementById('arr-'+id);
  if(!el)return;
  const open=el.style.display==='flex';
  el.style.display=open?'none':'flex';
  if(arr)arr.style.transform=open?'':'rotate(180deg)';
}

async function markPaid(debtId,num){
  const d=state.debts.find(x=>x.id===debtId);if(!d)return;
  const cur=d.paid_installments||0;
  // Toggle: if this is the last paid one, unpay it; otherwise pay up to this one
  const np = cur===num ? num-1 : Math.max(cur,num);
  const na=np*(d.installment_amount||0);
  if(!DEMO_MODE)await sb.from('debts').update({paid_installments:np,paid:na}).eq('id',debtId);
  d.paid_installments=np;d.paid=na;go('debts');
}

async function doChangePw(){

  if(p1.length<6){if(ee){ee.textContent='Minimo 6 caracteres';ee.classList.add('show');}return;}

}

const FX_CATS=[

async function submitFixed(){

function openReportSheet(){
  R('ov-report').classList.add('open');
  const el=R('report-month');

    el.value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');

function closeReport(){R('ov-report').classList.remove('open');}

function generateReport(){
  const monthVal=R('report-month')?.value;
  if(!monthVal){alert('Selecciona un mes');return;}
  const inclExp=R('rpt-expenses')?.checked!==false;
  const inclSav=R('rpt-savings')?.checked!==false;
  const inclDeb=R('rpt-debts')?.checked!==false;
  const inclFix=R('rpt-fixed')?.checked!==false;

  const[year,month]=monthVal.split('-');
  const monthName=new Date(year,month-1,1).toLocaleDateString('es-AR',{month:'long',year:'numeric'});
  const income=userProfile?.income||0;

  // Filter data for this month
  const mExp=state.expenses.filter(e=>e.date&&e.date.startsWith(monthVal));
  const mSav=state.savings.filter(s=>s.date&&s.date.startsWith(monthVal));
  const cashSpent=mExp.filter(e=>e.type==='cash').reduce((a,e)=>a+e.amount,0);
  const cardSpent=mExp.filter(e=>e.type==='card').reduce((a,e)=>a+e.amount,0);
  const totalSpent=cashSpent+cardSpent;
  const totalSaved=mSav.reduce((a,s)=>a+s.amount,0);
  const fixedActive=state.fixedExpenses.filter(f=>f.active);
  const fixedTotal=fixedActive.reduce((a,f)=>a+f.amount,0);
  const available=income-cashSpent-fixedTotal;

  // Group expenses by date
  const byDate={};
  mExp.forEach(e=>{
    const d=e.date||monthVal+'-01';
    if(!byDate[d])byDate[d]=[];
    byDate[d].push(e);
  });
  const sortedDates=Object.keys(byDate).sort();

  // Group by category
  const byCat={};
  CATS.forEach(c=>{byCat[c.id]={cash:0,card:0};});
  mExp.forEach(e=>{
    if(!byCat[e.category])byCat[e.category]={cash:0,card:0};
    if(e.type==='card')byCat[e.category].card+=e.amount;
    else byCat[e.category].cash+=e.amount;
  });
  const activeCats=CATS.filter(c=>(byCat[c.id]?.cash||0)+(byCat[c.id]?.card||0)>0)
    .sort((a,b)=>((byCat[b.id]?.cash||0)+(byCat[b.id]?.card||0))-((byCat[a.id]?.cash||0)+(byCat[a.id]?.card||0)));

  const catColors={food:'#10B981',transport:'#3B82F6',housing:'#8B5CF6',health:'#EC4899',entertainment:'#F59E0B',shopping:'#EF4444',education:'#06B6D4',other:'#94A3B8'};
  const fmtCur=n=>'$'+Math.round(n||0).toLocaleString('es-AR');
  const fmtDateR=s=>{if(!s)return'';const d=new Date(s+'T00:00:00');return d.toLocaleDateString('es-AR',{weekday:'short',day:'2-digit',month:'2-digit'});};

  // Debt installments due this month
  const debtInst=[];
  state.debts.forEach(d=>{
    if(!d.installments||!d.installment_amount||!d.start_month)return;
    const inst=getInst(d);
    inst.filter(i=>i.month===monthVal).forEach(i=>{
      debtInst.push({debtName:d.name,num:i.num,total:d.installments,amount:i.amount,paid:i.paid,due_date:i.due_date});
    });
  });

  // Build HTML report
  const html=`<!DOCTYPE html>

  .rpt-header{background:linear-gradient(135deg,#4F46E5,#3730A3);border-radius:16px;padding:32px;color:#fff;margin-bottom:24px;position:relative;overflow:hidden}
  .rpt-header::before{content:'';position:absolute;top:-40px;right:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}

<body>
<div class="page">

  <!-- HEADER -->
  <div class="rpt-header">
    <div class="rpt-logo">Mi Presupuesto</div>
    <div class="rpt-title">Reporte Mensual</div>
    <div class="rpt-sub">${monthName.charAt(0).toUpperCase()+monthName.slice(1)} - ${userProfile?.name||''}</div>
    <div class="rpt-date">Generado el<br>${new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'})}</div>
  </div>

  <!-- SUMMARY -->
  <div class="summary-grid">
    <div class="sum-card blue">
      <div class="sum-label">Ingreso del mes</div>
      <div class="sum-val">${fmtCur(income)}</div>
      <div class="sum-sub">Sueldo / ingreso mensual</div>
    </div>
    <div class="sum-card red">
      <div class="sum-label">Total gastado</div>
      <div class="sum-val">${fmtCur(totalSpent)}</div>
      <div class="sum-sub">Efec/Transf: ${fmtCur(cashSpent)} - TC: ${fmtCur(cardSpent)}</div>
    </div>
    <div class="sum-card green">
      <div class="sum-label">Ahorrado este mes</div>
      <div class="sum-val">${fmtCur(totalSaved)}</div>
      <div class="sum-sub">${mSav.length} entrada${mSav.length!==1?'s':''} de ahorro</div>
    </div>
    <div class="sum-card purple">
      <div class="sum-label">Disponible estimado</div>
      <div class="sum-val">${fmtCur(Math.max(0,available))}</div>
      <div class="sum-sub">Ingreso - gastos efectivo - fijos</div>
    </div>
  </div>

  ${inclExp&&activeCats.length?`
  <!-- GASTOS POR CATEGORIA -->
  <div class="section">
    <div class="section-title"><div class="dot" style="background:#4F46E5"></div>Gastos por categoria</div>
    ${activeCats.map(c=>{
      const cash=byCat[c.id]?.cash||0,card=byCat[c.id]?.card||0,total=cash+card;
      const maxT=((byCat[activeCats[0].id]?.cash||0)+(byCat[activeCats[0].id]?.card||0))||1;
      const barW=Math.round(total/maxT*100);
      const cashPct=total>0?Math.round(cash/total*100):0;
      const col=catColors[c.id]||'#94A3B8';
      return '<div class="cat-row">'
        +'<div class="cat-dot" style="background:'+col+'"></div>'
        +'<div class="cat-name">'+c.label+'</div>'
        +'<div class="cat-bar-wrap"><div class="cat-bar-inner" style="width:'+barW+'%">'
        +(cash>0?'<div style="width:'+cashPct+'%;background:#10B981;border-radius:4px 0 0 4px"></div>':'')
        +(card>0?'<div style="width:'+(100-cashPct)+'%;background:#F59E0B;border-radius:'+(cash>0?'0 4px 4px 0':'4px')+'"></div>':'')
        +'</div></div>'
        +'<div class="cat-amounts">'+fmtCur(total)+(card>0?' <span style="font-size:10px;color:#B45309">(TC: '+fmtCur(card)+')</span>':'')+'</div>'

    <div style="display:flex;gap:16px;margin-top:12px;padding-top:10px;border-top:1px solid #F1F5F9">
      <span style="display:flex;align-items:center;gap:5px;font-size:11px;color:#64748B"><span style="width:8px;height:8px;border-radius:2px;background:#10B981;display:inline-block"></span>Efec/Transf</span>
      <span style="display:flex;align-items:center;gap:5px;font-size:11px;color:#64748B"><span style="width:8px;height:8px;border-radius:2px;background:#F59E0B;display:inline-block"></span>Tarjeta de credito</span>
    </div>
  </div>
  `:''}

  ${inclExp&&sortedDates.length?`
  <!-- DETALLE CRONOLOGICO -->
  <div class="section">
    <div class="section-title"><div class="dot" style="background:#EF4444"></div>Detalle de gastos - dia a dia</div>
    ${sortedDates.map(date=>{
      const txns=byDate[date];
      const dayTotal=txns.reduce((a,e)=>a+e.amount,0);
      return '<div class="day-group">'
        +'<div class="day-label">'+fmtDateR(date)+' <span style="float:right;font-weight:600;color:#EF4444">'+fmtCur(dayTotal)+'</span></div>'
        +txns.map(e=>{
          const cat=getCat(e.category);
          const col=catColors[e.category]||'#94A3B8';
          return '<div class="txn-row">'
            +'<div class="txn-dot" style="background:'+col+'"></div>'
            +'<div class="txn-name">'+e.name+'</div>'

  ${inclSav?`

  <div class="section">

    :'<div style="text-align:center;padding:16px;color:#94A3B8;font-size:13px">Sin ahorros registrados este mes</div>'}
    ${mSav.length?'<div style="display:flex;justify-content:space-between;padding-top:10px;border-top:2px solid #F1F5F9;margin-top:4px"><span style="font-size:13px;font-weight:700;color:#64748B">TOTAL AHORRADO</span><span style="font-size:15px;font-weight:800;color:#10B981">+'+fmtCur(totalSaved)+'</span></div>':''}
  </div>
  `:''}

  ${inclDeb&&debtInst.length?`
  <!-- DEUDAS / CUOTAS -->
  <div class="section">
    <div class="section-title"><div class="dot" style="background:#EF4444"></div>Cuotas de deudas este mes</div>
    ${debtInst.map(i=>'<div class="debt-row '+(i.paid?'debt-paid':'debt-unpaid')+'">'

      +'<div style="text-align:right"><div style="font-size:13px;font-weight:800;color:'+(i.paid?'#10B981':'#EF4444')+'">'+fmtCur(i.amount)+'</div>'

      +'</div>').join('')}
  </div>
  `:''}

  <!-- FOOTER -->
  <div class="rpt-footer">
    Reporte generado por Mi Presupuesto - ${new Date().toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
  </div>

</div>
</body>
</html>`;

  // Download
  const blob=new Blob([html],{type:'text/html;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='reporte-'+monthVal+'-'+(userProfile?.name||'presupuesto').replace(/\s+/g,'-').toLowerCase()+'.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  closeReport();
}

// TOGGLE RECENT
function toggleRecent(){
  const wrap=R('recent-wrap');
  const arrow=R('recent-arrow');
  if(!wrap)return;
  const isOpen=wrap.style.maxHeight!=='0px'&&wrap.style.maxHeight!=='';
  if(isOpen){
    wrap.style.maxHeight='0px';
    if(arrow)arrow.style.transform='rotate(-90deg)';
  }else{
    wrap.style.maxHeight='2000px';
    if(arrow)arrow.style.transform='rotate(0deg)';
  }
}

}

window.addEventListener('load', function() {
  var to = setTimeout(function() {
    var r = document.getElementById('root');
    if (r && r.innerHTML.includes('Cargando')) {
      r.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:32px;text-align:center"><h2 style="color:#EF4444;margin-bottom:12px">Error de conexion</h2><p style="color:#64748B;margin-bottom:20px;font-size:14px">Verifica tu internet e intenta de nuevo.</p><button onclick="location.reload()" style="background:#4F46E5;color:#fff;border:none;border-radius:10px;padding:14px 28px;font-size:15px;font-weight:700;cursor:pointer">Reintentar</button></div>';
    }
  }, 10000);
  var p = init();
  if (p && p.then) {
    p.then(function(){ clearTimeout(to); }).catch(function(e){
      clearTimeout(to);
      var r = document.getElementById('root');
      if (r) r.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:32px;text-align:center"><h2 style="color:#EF4444;margin-bottom:12px">Error al iniciar</h2><p style="color:#64748B;margin-bottom:20px;font-size:13px">' + String(e) + '</p><button onclick="location.reload()" style="background:#4F46E5;color:#fff;border:none;border-radius:10px;padding:14px 28px;font-size:15px;font-weight:700;cursor:pointer">Reintentar</button></div>';
    });
  }
});;
